<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Penjual — CampusBite</title>
  <link rel="stylesheet" href="css/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="#">CampusBite <span class="badge bg-success">Panel Tenant / Penjual</span></a>
    <button class="btn btn-outline-light btn-sm" onclick="logout()">Keluar</button>
  </nav>

  <div class="container my-5">
    <div class="row">
      <div class="col-md-4">
        <div class="card border-0 shadow-sm p-3">
          <h5 class="fw-bold mb-3">➕ Tambah Jajanan / Barang Baru</h5>
          <form id="addProductForm">
            <div class="mb-2">
              <label class="small fw-bold">Nama Menu / Produk</label>
              <input type="text" id="prodName" class="form-control form-control-sm" required>
            </div>
            <div class="mb-2">
              <label class="small fw-bold">Kategori</label>
              <select id="prodCat" class="form-select form-select-sm">
                <option value="makanan">Makanan Berat</option>
                <option value="camilan">Camilan & Snack</option>
                <option value="minuman">Minuman</option>
                <option value="aksesoris">Thrift & Aksesori</option>
              </select>
            </div>
            <div class="mb-2">
              <label class="small fw-bold">Harga (Rp)</label>
              <input type="number" id="prodPrice" class="form-control form-control-sm" required>
            </div>
            <div class="mb-3">
              <label class="small fw-bold">Nama File Gambar (cth: naskun.png)</label>
              <input type="text" id="prodImg" class="form-control form-control-sm" value="nasi_ayam_geprek.png" required>
            </div>
            <button type="submit" class="btn btn-success btn-sm w-100 fw-bold">Publikasikan Produk</button>
          </form>
        </div>
      </div>

      <div class="col-md-8">
        <div class="card border-0 shadow-sm p-3">
          <h5 class="fw-bold mb-3">📦 Daftar Jualan Saya</h5>
          <div id="sellerProductList" class="table-responsive">
            <p class="text-muted small">Belum ada produk yang ditambahkan.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function logout() {
      localStorage.removeItem('campusbite_role');
      window.location.href = 'login.html';
    }

    document.getElementById('addProductForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var name = document.getElementById('prodName').value;
      var price = document.getElementById('prodPrice').value;
      var img = document.getElementById('prodImg').value;

      alert('Produk "' + name + '" berhasil ditambahkan ke katalog kampus!');
      // Di sini bisa disimpan ke localStorage jika ingin produknya tampil secara dinamis di index.html
      this.reset();
    });
  </script>
</body>
</html>
