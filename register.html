<!DOCTYPE html>
<html lang="id">
<head>
  <script>document.documentElement.classList.add("js")</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun — CampusBite</title>
  <link rel="stylesheet" href="css/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

  <div class="card border-0 shadow-sm p-4" style="width: 100%; max-width: 420px;">
    <div class="text-center mb-3">
      <a href="index.html" class="brand fs-3 text-dark text-decoration-none">CampusBite<span class="text-success">.</span></a>
      <p class="text-muted small mt-1">Buat akun untuk beli & jajan di kampus</p>
    </div>

    <form onsubmit="event.preventDefault(); alert('Registrasi Berhasil! Silakan masuk.'); window.location.href='login.html';">
      <div class="mb-3">
        <label class="form-label small fw-bold">NAMA LENGKAP</label>
        <input type="text" class="form-control" placeholder="Cth: Budi Santoso" required>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-bold">EMAIL KAMPUS</label>
        <input type="email" class="form-control" placeholder="nama@student.univ.ac.id" required>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-bold">KATA SANDI</label>
        <input type="password" class="form-control" placeholder="••••••••" required>
      </div>
      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="isSellerCheck">
        <label class="form-check-label small" for="isSellerCheck">Saya juga ingin <strong>membuka tenant / berjualan</strong> makanan & thrift</label>
      </div>
      <button type="submit" class="btn btn-success w-100 fw-bold py-2">Daftar Sekarang</button>
    </form>

    <div class="text-center mt-3 small text-muted">
      Sudah punya akun? <a href="login.html" class="text-success fw-bold">Masuk di sini</a>
    </div>
  </div>

<script src="js/vendor/bootstrap.bundle.min.js"></script>
</body>
</html>
